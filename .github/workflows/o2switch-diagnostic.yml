name: o2switch-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/o2switch-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read o2switch diagnostics
        run: |
          set +e
          echo "===== PUBLIC HEALTH ====="
          curl -fsS https://build-autonomia.com/api/health || true
          echo
          echo "===== PUBLIC DEPLOY DEBUG ====="
          curl -fsS https://build-autonomia.com/__autonomia_deploy_debug.txt || true
          echo
          echo "===== PUBLIC COCKPIT RECOVERY DEBUG ====="
          curl -fsS https://build-autonomia.com/__autonomia_cockpit_recovery_debug.txt || true
          echo
          echo "===== COCKPIT HEALTH ====="
          curl -fsS https://cockpit.build-autonomia.com/api/health || true
          echo
          echo "===== COCKPIT DEPLOY DEBUG ====="
          curl -fsS https://cockpit.build-autonomia.com/__autonomia_cockpit_deploy_debug.txt || true
          echo
          echo "===== END-TO-END INBOUND LEAD TEST ====="
          TEST_ID="diag-$(date +%s)"
          RECEIVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START="$(date +%s)"
          PAYLOAD="$(printf '%s' '{"external_lead_id":"__ID__","source_channel":"website","source_platform":"autonomia_public_site","received_at":"__AT__","first_name":"AUTONOMIA","last_name":"DIAGNOSTIC","email":"diagnostic@build-autonomia.com","phone":"0600000000","company_name":"AUTONOMIA DIAGNOSTIC","requested_service":"diagnostic_pipeline","message":"Diagnostic technique du pipeline inbound","form_id":"diagnostic-pipeline","landing_page_topic":"Diagnostic pipeline","landing_page_url":"https://build-autonomia.com/","marketing_consent":false,"consent_timestamp":"__AT__","privacy_notice_version":"diagnostic","consent_source":"diagnostic-pipeline"}' | sed "s/__ID__/$TEST_ID/g; s/__AT__/$RECEIVED_AT/g")"
          HTTP_CODE="$(curl -sS --max-time 20 \
            -o /tmp/inbound-response.json \
            -w "%{http_code}" \
            -X POST https://build-autonomia.com/api/leads \
            -H "content-type: application/json" \
            --data "$PAYLOAD" || true)"
          END="$(date +%s)"
          echo "HTTP=$HTTP_CODE duration=$((END-START))s"
          cat /tmp/inbound-response.json 2>/dev/null || true
          echo
