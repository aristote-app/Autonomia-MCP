name: validate-public-site-production

on:
  push:
    branches:
      - public-site-production
    paths:
      - "site/**"
      - ".github/workflows/validate-public-site-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate editorial content
        run: npm run content:validate

      - name: Organic Engine report
        run: npm run organic:report

      - name: SEO static audit
        run: npm run seo:audit

      - name: Organic decision engine tests
        run: npm run seo:engine-test

      - name: Editorial opportunity engine tests
        run: npm run seo:opportunity-test

      - name: Validate commercial BUILD guides
        run: npm run build-guides:test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://build-autonomia.com
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Report validated public-site build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" \
            -d "$(python -c 'import json,os;print(json.dumps({"state":"success","context":"public-site/validated-build","description":"Next build, SEO audits and checks passed","target_url":os.environ["RUN_URL"]}))')"

      - name: Report failed public-site validation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" \
            -d "$(python -c 'import json,os;print(json.dumps({"state":"failure","context":"public-site/validated-build","description":"Public-site validation failed; consult Actions","target_url":os.environ["RUN_URL"]}))')"
