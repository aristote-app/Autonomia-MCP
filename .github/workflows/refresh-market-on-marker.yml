name: refresh-market

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/refresh-market-now"

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Request scoped GitHub OIDC token
        run: |
          set +x

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::GitHub OIDC token request environment is unavailable."
            exit 1
          fi

          response="$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=autonomia-market-refresh")"

          MARKET_REFRESH_TOKEN="$(printf "%s" "$response" | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const payload = JSON.parse(raw);
            if (!payload?.value) process.exit(2);
            process.stdout.write(payload.value);
          ')"

          echo "::add-mask::$MARKET_REFRESH_TOKEN"
          echo "MARKET_REFRESH_TOKEN=$MARKET_REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Refresh Free-Work and job signals
        id: freelance
        run: |
          rm -f /tmp/autonomia-freelance.json

          for attempt in $(seq 1 36); do
            status="$(curl -sS \
              -o /tmp/autonomia-freelance.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $MARKET_REFRESH_TOKEN" \
              "https://autonomia-mcp.vercel.app/api/cron/freelance-refresh" || true)"

            echo "Freelance refresh attempt $attempt: HTTP $status"

            if [ "$status" = "200" ] || [ "$status" = "502" ]; then
              echo "status=$status" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for the production freelance refresh route."
          exit 1

      - name: Report freelance refresh
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const payload = JSON.parse(
            fs.readFileSync("/tmp/autonomia-freelance.json", "utf8")
          );

          const summary = {
            ok: Boolean(payload.ok),
            freelance: {
              ok: Boolean(payload.freelance?.ok),
              fetchedRows: payload.freelance?.fetchedRows ?? 0,
              persistedRows: payload.freelance?.persistedRows ?? 0,
              source: payload.freelance?.source ?? "freework",
              error: payload.freelance?.error ?? null
            },
            jobSignals: {
              available: Boolean(payload.jobSignals?.available),
              discoveredRows: payload.jobSignals?.discoveredRows ?? 0,
              persistedRows: payload.jobSignals?.persistedRows ?? 0,
              reason:
                payload.jobSignals?.reason ??
                payload.jobSignals?.error ??
                null
            }
          };

          console.log(JSON.stringify(summary, null, 2));

          if (!summary.freelance.ok) process.exit(1);
          NODE

      - name: Refresh public and training market
        id: public_market
        run: |
          rm -f /tmp/autonomia-public-market.json

          status="$(curl -sS \
            --max-time 75 \
            -o /tmp/autonomia-public-market.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $MARKET_REFRESH_TOKEN" \
            "https://autonomia-mcp.vercel.app/api/cron/market-refresh?mode=public" || true)"

          echo "Public/training refresh: HTTP $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" != "200" ]; then
            echo "::error::Public/training refresh did not complete successfully."
            exit 1
          fi

      - name: Report public market refresh
        if: always() && steps.public_market.outputs.status != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          if (!fs.existsSync("/tmp/autonomia-public-market.json")) process.exit(0);

          const payload = JSON.parse(
            fs.readFileSync("/tmp/autonomia-public-market.json", "utf8")
          );

          const runs = Array.isArray(payload.runs) ? payload.runs : [];
          console.log(JSON.stringify({
            ok: Boolean(payload.ok),
            mode: payload.mode ?? null,
            successfulQueries: runs.filter((run) => run.ok).length,
            failedQueries: runs.filter((run) => !run.ok).length,
            persistedRows: runs.reduce(
              (sum, run) => sum + Number(run.persistedRows || 0),
              0
            )
          }, null, 2));
          NODE
