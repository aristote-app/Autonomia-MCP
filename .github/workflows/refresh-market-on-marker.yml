name: refresh-market

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/refresh-market-now"

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Request scoped GitHub OIDC token
        run: |
          set +x

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::GitHub OIDC token request environment is unavailable."
            exit 1
          fi

          response="$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=autonomia-market-refresh")"

          MARKET_REFRESH_TOKEN="$(printf "%s" "$response" | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const payload = JSON.parse(raw);
            if (!payload?.value) process.exit(2);
            process.stdout.write(payload.value);
          ')"

          echo "::add-mask::$MARKET_REFRESH_TOKEN"
          echo "MARKET_REFRESH_TOKEN=$MARKET_REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Refresh Free-Work and job signals
        id: freelance
        run: |
          rm -f /tmp/autonomia-freelance.json

          for attempt in $(seq 1 36); do
            status="$(curl -sS \
              -o /tmp/autonomia-freelance.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $MARKET_REFRESH_TOKEN" \
              "https://cockpit.build-autonomia.com/api/cron/freelance-refresh" || true)"

            echo "Freelance refresh attempt $attempt: HTTP $status"

            if [ "$status" = "200" ] || [ "$status" = "502" ]; then
              echo "status=$status" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for the production freelance refresh route."
          exit 1

      - name: Report freelance refresh
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const payload = JSON.parse(
            fs.readFileSync("/tmp/autonomia-freelance.json", "utf8")
          );

          const summary = {
            ok: Boolean(payload.ok),
            freelance: {
              ok: Boolean(payload.freelance?.ok),
              fetchedRows: payload.freelance?.fetchedRows ?? 0,
              persistedRows: payload.freelance?.persistedRows ?? 0,
              source: payload.freelance?.source ?? "freework",
              error: payload.freelance?.error ?? null
            },
            jobSignals: {
              available: Boolean(payload.jobSignals?.available),
              discoveredRows: payload.jobSignals?.discoveredRows ?? 0,
              persistedRows: payload.jobSignals?.persistedRows ?? 0,
              reason:
                payload.jobSignals?.reason ??
                payload.jobSignals?.error ??
                null
            }
          };

          console.log(JSON.stringify(summary, null, 2));

          if (!summary.freelance.ok) process.exit(1);
          NODE

      - name: Refresh territory signals
        id: territory_signals
        run: |
          rm -f /tmp/autonomia-territories.json

          status="$(curl -sS \
            --max-time 75 \
            -o /tmp/autonomia-territories.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $MARKET_REFRESH_TOKEN" \
            "https://cockpit.build-autonomia.com/api/cron/market-refresh?mode=territories" || true)"

          echo "Territory refresh: HTTP $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" != "200" ]; then
            cat /tmp/autonomia-territories.json || true
            echo "::error::Territory signal refresh did not complete successfully."
            exit 1
          fi

      - name: Report territory signal refresh
        if: always() && steps.territory_signals.outputs.status != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          if (!fs.existsSync("/tmp/autonomia-territories.json")) process.exit(0);
          const raw = fs.readFileSync("/tmp/autonomia-territories.json", "utf8");
          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            console.log(raw);
            process.exit(1);
          }

          console.log(JSON.stringify({
            ok: Boolean(payload.ok),
            mode: payload.mode ?? null,
            territorySignals: {
              available: Boolean(payload.territorySignals?.available),
              matchedTerritories: payload.territorySignals?.matched_territories ?? 0,
              candidateSignals: payload.territorySignals?.candidate_signals ?? 0,
              persistedRows: payload.territorySignals?.persisted ?? 0,
              duplicates: payload.territorySignals?.duplicates ?? 0,
              fetched: payload.territorySignals?.fetched ?? 0,
              withBuyerSiren: payload.territorySignals?.with_buyer_siren ?? 0,
              error: payload.territorySignals?.error ?? null
            }
          }, null, 2));
          NODE

      - name: Refresh public and training market
        id: public_market
        run: |
          rm -f /tmp/autonomia-public-market-*.json
          : > /tmp/autonomia-public-market.ndjson
          success=0
          i=0

          for query in "intelligence artificielle" "IA générative" "LLM" "agent IA"; do
            i=$((i + 1))
            file="/tmp/autonomia-public-market-$i.json"

            status="$(curl -sS \
              --max-time 55 \
              -o "$file" \
              -w "%{http_code}" \
              -G \
              -H "Authorization: Bearer $MARKET_REFRESH_TOKEN" \
              --data-urlencode "mode=public" \
              --data-urlencode "q=$query" \
              "https://cockpit.build-autonomia.com/api/cron/market-refresh" || true)"

            echo "Public/training refresh [$query]: HTTP $status"

            if [ "$status" = "200" ]; then
              success=1
              node --input-type=module -e '
                import fs from "node:fs";
                const [file, query] = process.argv.slice(1);
                const raw = fs.readFileSync(file, "utf8");
                let payload;
                try {
                  payload = JSON.parse(raw);
                } catch {
                  payload = { ok: false, mode: "public", query, raw_error: raw.slice(0, 500) };
                }
                process.stdout.write(JSON.stringify({ query, payload }) + "\n");
              ' "$file" "$query" >> /tmp/autonomia-public-market.ndjson
            else
              echo "::warning::Public/training query '$query' returned HTTP $status."
            fi
          done

          echo "status=$success" >> "$GITHUB_OUTPUT"
          if [ "$success" != "1" ]; then
            echo "::error::No public/training market query completed successfully."
            exit 1
          fi

      - name: Report public market refresh
        if: always() && steps.public_market.outputs.status != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          if (!fs.existsSync("/tmp/autonomia-public-market.ndjson")) process.exit(0);

          const rows = fs.readFileSync("/tmp/autonomia-public-market.ndjson", "utf8")
            .split(/\n+/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));

          const runs = rows.flatMap((row) =>
            Array.isArray(row.payload?.runs) ? row.payload.runs : []
          );

          console.log(JSON.stringify({
            ok: rows.some((row) => Boolean(row.payload?.ok)),
            mode: "public",
            completedQueries: rows.length,
            successfulQueries: runs.filter((run) => run.ok).length,
            failedQueries: runs.filter((run) => !run.ok).length,
            persistedRows: runs.reduce(
              (sum, run) => sum + Number(run.persistedRows || 0),
              0
            )
          }, null, 2));
          NODE
