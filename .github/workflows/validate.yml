name: validate

on:
  push:
    branches:
      - build/autonomia-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Smoke test BOAMP and TED
        run: npm run smoke:public
      - name: Smoke test DECP and dedupe
        run: npm run smoke:data
      - name: Smoke test AI taxonomy
        run: npm run smoke:taxonomy
      - name: Smoke test scoring
        run: npm run smoke:scoring
      - name: Smoke test MCP
        run: npm run smoke:mcp
