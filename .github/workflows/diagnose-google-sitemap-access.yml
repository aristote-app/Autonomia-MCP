name: diagnose-google-sitemap-access

on:
  push:
    branches:
      - public-site-production
    paths:
      - ".github/workflows/diagnose-google-sitemap-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DNS diagnostics
        run: |
          set -x
          sudo apt-get update >/dev/null 2>&1
          sudo apt-get install -y dnsutils >/dev/null 2>&1
          echo "=== default resolver ==="
          dig +short build-autonomia.com A
          echo "=== Google DNS ==="
          dig @8.8.8.8 +short build-autonomia.com A
          echo "=== Cloudflare DNS ==="
          dig @1.1.1.1 +short build-autonomia.com A
          echo "=== NS ==="
          dig +short build-autonomia.com NS
          echo "=== CAA ==="
          dig +short build-autonomia.com CAA

      - name: HTTP diagnostics by user agent
        env:
          URL: https://build-autonomia.com/sitemap.xml
        run: |
          set -euo pipefail
          test_ua() {
            NAME="$1"
            UA="$2"
            echo "=== $NAME ==="
            curl -sS -D /tmp/headers -o /tmp/body               -A "$UA"               --connect-timeout 10               --max-time 30               "$URL" || true
            head -50 /tmp/headers || true
            echo "BODY_PREFIX:"
            head -c 500 /tmp/body || true
            echo
            echo
          }
          test_ua "normal" "Mozilla/5.0"
          test_ua "Googlebot" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          test_ua "Google-InspectionTool" "Mozilla/5.0 (compatible; Google-InspectionTool/1.0;)"
          test_ua "Googlebot-Smartphone" "Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"

      - name: Robots diagnostics by Googlebot
        run: |
          curl -sS -D - -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" https://build-autonomia.com/robots.txt | head -100
