name: refresh-territories

on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/refresh-territories-now"

permissions:
  contents: read
  id-token: write

jobs:
  refresh-territories:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check python-calamine==0.8.2

      - name: Request scoped GitHub OIDC token
        run: |
          set +x
          response="$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=autonomia-market-refresh")"

          TOKEN="$(printf "%s" "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$TOKEN"
          echo "TERRITORY_REFRESH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          TOKEN="$TOKEN" python - <<'PY'
          import base64, json, os
          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          safe = {
              "repository": claims.get("repository"),
              "ref": claims.get("ref"),
              "workflow_ref": claims.get("workflow_ref"),
              "job_workflow_ref": claims.get("job_workflow_ref"),
              "event_name": claims.get("event_name"),
              "aud": claims.get("aud"),
          }
          print("OIDC claims:", json.dumps(safe, sort_keys=True))
          PY

      - name: Download current BANATIC national export
        id: download
        run: |
          set -e
          CURRENT_URL="https://www.banatic.interieur.gouv.fr/consultation/api/export/pregenere/telecharger/France"
          FALLBACK_URL="https://static.data.gouv.fr/resources/base-nationale-sur-les-intercommunalites/20250203-143929/liste-des-groupements-france-entiere-20250127.csv"

          if curl -fL --retry 3 --connect-timeout 30 --max-time 420 "$CURRENT_URL" -o /tmp/banatic.xlsx; then
            echo "path=/tmp/banatic.xlsx" >> "$GITHUB_OUTPUT"
            echo "source=current_banatic_xlsx" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Current BANATIC XLSX unavailable; using official Data.gouv CSV fallback."
            curl -fL --retry 3 --connect-timeout 30 --max-time 120 "$FALLBACK_URL" -o /tmp/banatic.csv
            echo "path=/tmp/banatic.csv" >> "$GITHUB_OUTPUT"
            echo "source=data_gouv_csv_fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CC and CA only
        run: |
          python scripts/extract-banatic-territories.py "${{ steps.download.outputs.path }}" /tmp/territories.json

      - name: Import territories in batches
        run: |
          python - <<'PY'
          import json, os, urllib.request

          data = json.load(open("/tmp/territories.json", encoding="utf-8"))
          items = data["items"]
          started_at = data["sourceUpdatedAt"]
          token = os.environ["TERRITORY_REFRESH_TOKEN"]
          endpoint = "https://cockpit.build-autonomia.com/api/territories/import"

          def post(payload):
              body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          total = 0
          for i in range(0, len(items), 150):
              batch = items[i:i+150]
              result = post({
                  "items": batch,
                  "sourceUpdatedAt": data["sourceUpdatedAt"]
              })
              total += int(result.get("count", 0))
              print(f"batch {i//150 + 1}: {result.get('count', 0)}")

          final = post({"action": "finalize", "startedAt": started_at})
          print(json.dumps({
              "source": "${{ steps.download.outputs.source }}",
              "extracted": len(items),
              "cc": data["counts"]["CC"],
              "ca": data["counts"]["CA"],
              "persisted": total,
              "activeTerritories": final.get("activeTerritories")
          }, ensure_ascii=False))
          PY
