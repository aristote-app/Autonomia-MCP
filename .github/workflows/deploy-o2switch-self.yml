name: deploy-o2switch-self

on:
  workflow_run:
    workflows:
      - validate
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: autonomia-o2switch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe cockpit health
        run: |
          echo "Production health before deploy:"
          curl -fsS "https://cockpit.build-autonomia.com/api/health" || true
          echo

      - name: Request GitHub OIDC deployment identity
        id: oidc
        env:
          AUDIENCE: autonomia-o2switch
        run: |
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$TOKEN" ]; then
            echo "::error::GitHub OIDC token is empty."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger SHA-pinned o2switch self-deploy
        env:
          DEPLOY_URL: https://cockpit.build-autonomia.com/api/internal/self-deploy
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HTTP_CODE="$(curl -sS \
            -o /tmp/autonomia-self-deploy.json \
            -w "%{http_code}" \
            -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"$TARGET_SHA\"}")"

          cat /tmp/autonomia-self-deploy.json

          if [ "$HTTP_CODE" = "202" ]; then
            echo "o2switch self-deploy accepted for $TARGET_SHA."
            exit 0
          fi

          echo "::error::Self-deploy endpoint returned HTTP $HTTP_CODE."
          exit 1
