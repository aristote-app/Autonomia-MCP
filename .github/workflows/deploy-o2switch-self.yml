name: deploy-o2switch-self

on:
  workflow_run:
    workflows:
      - validate
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: autonomia-o2switch-deploy-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Confirm cockpit deploy target is still current
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aristote-app/Autonomia-MCP/branches/main \
            | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"

          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "Deploy target is current: $TARGET_SHA"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale cockpit deploy target $TARGET_SHA; current main head is $CURRENT_SHA"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe cockpit deployment capability
        if: steps.target.outputs.should_deploy == 'true'
        id: probe
        run: |
          echo "Production health before deploy:"
          HEALTH="$(curl -fsS "https://cockpit.build-autonomia.com/api/health" || true)"
          printf '%s\n' "$HEALTH"
          MODE="$(printf '%s' "$HEALTH" | python -c 'import json,sys; print(json.load(sys.stdin).get("selfDeployAuthMode", ""))' 2>/dev/null || true)"
          if [ "$MODE" = "github_oidc" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub OIDC self-deploy is active in production."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production does not expose GitHub OIDC self-deploy."
            exit 1
          fi

      - name: Request GitHub OIDC deployment identity
        if: steps.probe.outputs.ready == 'true'
        id: oidc
        env:
          AUDIENCE: autonomia-o2switch
        run: |
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$TOKEN" ]; then
            echo "::error::GitHub OIDC token is empty."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger SHA-pinned o2switch self-deploy
        if: steps.probe.outputs.ready == 'true'
        env:
          DEPLOY_URL: https://cockpit.build-autonomia.com/api/internal/self-deploy
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HTTP_CODE="$(curl -sS \
            -o /tmp/autonomia-self-deploy.json \
            -w "%{http_code}" \
            -G "$DEPLOY_URL" \
            --data-urlencode "action=deploy" \
            --data-urlencode "sha=$TARGET_SHA" \
            -H "Authorization: Bearer $OIDC_TOKEN")"

          cat /tmp/autonomia-self-deploy.json
          echo

          if [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Self-deploy endpoint returned HTTP $HTTP_CODE."
            exit 1
          fi

          echo "o2switch self-deploy accepted for $TARGET_SHA."

      - name: Verify production and retry once if needed
        if: steps.probe.outputs.ready == 'true'
        env:
          DEPLOY_URL: https://cockpit.build-autonomia.com/api/internal/self-deploy
          HEALTH_URL: https://cockpit.build-autonomia.com/api/health
          CONSULTANTS_URL: https://cockpit.build-autonomia.com/consultants
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          AUDIENCE: autonomia-o2switch
        run: |
          verify_target() {
            HEALTH="$(curl -fsS "$HEALTH_URL" || true)"
            DEPLOYED_SHA="$(printf '%s' "$HEALTH" | python -c 'import json,sys; print(json.load(sys.stdin).get("deployedSha", ""))' 2>/dev/null || true)"

            if [ -n "$DEPLOYED_SHA" ]; then
              if [ "$DEPLOYED_SHA" = "$TARGET_SHA" ]; then
                echo "Production health confirms target SHA: $TARGET_SHA"
                return 0
              fi
              echo "Production still serves SHA $DEPLOYED_SHA; waiting for $TARGET_SHA."
              return 1
            fi

            BODY="$(curl -fsS "$CONSULTANTS_URL" || true)"
            if printf '%s' "$BODY" | grep -Fq "CANDIDATS DÉCOUVERTS" && ! printf '%s' "$BODY" | grep -Fq "Visible uniquement après authentification du workspace"; then
              echo "Legacy production without deployedSha confirms the admin-gate fix is live."
              return 0
            fi

            return 1
          }

          echo "Waiting for background build + Passenger restart..."
          for attempt in $(seq 1 36); do
            if verify_target; then
              exit 0
            fi
            echo "Target not live yet (attempt $attempt/36)."
            sleep 10
          done

          echo "First deploy was accepted but did not become visible. Retrying once with a fresh OIDC token."

          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          RETRY_TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          HTTP_CODE="$(curl -sS \
            -o /tmp/autonomia-self-deploy-retry.json \
            -w "%{http_code}" \
            -G "$DEPLOY_URL" \
            --data-urlencode "action=deploy" \
            --data-urlencode "sha=$TARGET_SHA" \
            -H "Authorization: Bearer $RETRY_TOKEN")"

          cat /tmp/autonomia-self-deploy-retry.json
          echo

          if [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Retry self-deploy endpoint returned HTTP $HTTP_CODE."
            exit 1
          fi

          for attempt in $(seq 1 18); do
            if verify_target; then
              exit 0
            fi
            echo "Target still not live after retry (attempt $attempt/36)."
            sleep 10
          done

          echo "::error::o2switch accepted the deploy twice but production never switched to the target version."
          exit 1

      - name: Dump cockpit o2switch worker log on failure
        if: failure()
        run: |
          echo "===== COCKPIT O2SWITCH WORKER LOG ====="
          curl -fsS "https://cockpit.build-autonomia.com/__autonomia_cockpit_deploy_debug.txt" || echo "Diagnostic log not reachable yet."
          echo
          echo "===== END COCKPIT O2SWITCH WORKER LOG ====="

      - name: Bootstrap consultant candidates once
        if: steps.probe.outputs.ready == 'true'
        env:
          BOOTSTRAP_URL: https://cockpit.build-autonomia.com/api/internal/talent-bootstrap
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          HTTP_CODE="$(curl -sS \
            -o /tmp/autonomia-talent-bootstrap.json \
            -w "%{http_code}" \
            -X POST "$BOOTSTRAP_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN")"

          if [ "$HTTP_CODE" = "200" ]; then
            cat /tmp/autonomia-talent-bootstrap.json
            echo
            echo "Talent Hunter bootstrap completed or was already seeded."
            exit 0
          fi

          echo "::warning::Talent Hunter bootstrap returned HTTP $HTTP_CODE after a verified deployment."
          exit 0


      - name: Refresh GitHub OIDC identity for inbound drain
        if: always() && steps.probe.outputs.ready == 'true'
        id: inbound_oidc
        env:
          AUDIENCE: autonomia-o2switch
        run: |
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$TOKEN" ]; then
            echo "::error::GitHub OIDC token is empty."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Drain inbound spool and verify
        if: always() && steps.probe.outputs.ready == 'true'
        env:
          INBOUND_SPOOL_URL: https://cockpit.build-autonomia.com/api/internal/inbound-spool
          OIDC_TOKEN: ${{ steps.inbound_oidc.outputs.token }}
        run: |
          HTTP_CODE="$(curl -sS \
            --max-time 60 \
            -o /tmp/autonomia-inbound-spool.json \
            -w "%{http_code}" \
            -G "$INBOUND_SPOOL_URL" \
            --data-urlencode "action=drain" \
            -H "Authorization: Bearer $OIDC_TOKEN")"

          cat /tmp/autonomia-inbound-spool.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Inbound spool drain returned HTTP $HTTP_CODE."
            exit 1
          fi

          OK="$(cat /tmp/autonomia-inbound-spool.json | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("ok"))).lower())')"
          if [ "$OK" != "true" ]; then
            echo "::error::Inbound spool drain did not confirm ok=true."
            exit 1
          fi

      - name: Refresh GitHub OIDC identity for SEO GEO diagnostic
        if: always() && steps.probe.outputs.ready == 'true'
        id: seo_geo_oidc
        env:
          AUDIENCE: autonomia-o2switch
        run: |
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$TOKEN" ]; then
            echo "::error::GitHub OIDC token is empty."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Refresh territory market signals
        if: always() && steps.probe.outputs.ready == 'true'
        env:
          TERRITORY_URL: https://cockpit.build-autonomia.com/api/internal/territory-signal-refresh
          OIDC_TOKEN: ${{ steps.seo_geo_oidc.outputs.token }}
        run: |
          HTTP_CODE="$(curl -sS \
            --max-time 120 \
            -o /tmp/autonomia-territory-refresh.json \
            -w "%{http_code}" \
            -G "$TERRITORY_URL" \
            --data-urlencode "limit=40" \
            -H "Authorization: Bearer $OIDC_TOKEN")"

          cat /tmp/autonomia-territory-refresh.json
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Territory signal refresh returned HTTP $HTTP_CODE."
          fi

      - name: Verify cockpit SEO GEO connection
        if: always() && steps.probe.outputs.ready == 'true'
        env:
          SEO_GEO_URL: https://cockpit.build-autonomia.com/api/internal/seo-geo-refresh
          OIDC_TOKEN: ${{ steps.seo_geo_oidc.outputs.token }}
        run: |
          STATUS="$(curl -fsS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$SEO_GEO_URL")"
          printf '%s\n' "$STATUS"

          OK="$(printf '%s' "$STATUS" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("ok"))).lower())')"
          if [ "$OK" != "true" ]; then
            echo "::error::Cockpit SEO/GEO connection is not healthy."
            exit 1
          fi
