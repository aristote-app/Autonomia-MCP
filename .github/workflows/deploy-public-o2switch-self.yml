name: deploy-public-o2switch-self

on:
  workflow_run:
    workflows:
      - validate-public-site-production
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: autonomia-public-o2switch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'public-site-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Confirm public deploy target is still current
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aristote-app/Autonomia-MCP/branches/public-site-production \
            | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"

          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "Deploy target is current: $TARGET_SHA"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale deploy target $TARGET_SHA; current public head is $CURRENT_SHA"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub OIDC deployment identity
        if: steps.target.outputs.should_deploy == 'true'
        id: oidc
        env:
          AUDIENCE: autonomia-public-o2switch
        run: |
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$TOKEN" ]; then
            echo "::error::GitHub OIDC token is empty."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger public-site o2switch deploy
        if: steps.target.outputs.should_deploy == 'true'
        env:
          DEPLOY_URL: https://build-autonomia.com/api/internal/self-deploy
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          HTTP_CODE="$(curl -sS \
            -o /tmp/autonomia-public-self-deploy.json \
            -w "%{http_code}" \
            -G "$DEPLOY_URL" \
            --data-urlencode "action=deploy" \
            --data-urlencode "sha=$TARGET_SHA" \
            -H "Authorization: Bearer $OIDC_TOKEN")"

          cat /tmp/autonomia-public-self-deploy.json
          echo

          if [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Public self-deploy endpoint returned HTTP $HTTP_CODE."
            exit 1
          fi

      - name: Verify public production
        if: steps.target.outputs.should_deploy == 'true'
        env:
          HEALTH_URL: https://build-autonomia.com/api/health
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 90); do
            HEALTH="$(curl -fsS "$HEALTH_URL" || true)"
            DEPLOYED_SHA="$(printf '%s' "$HEALTH" | python -c 'import json,sys; print(json.load(sys.stdin).get("deployedSha", ""))' 2>/dev/null || true)"

            echo "Observed deployed SHA: ${DEPLOYED_SHA:-<none>} (attempt $attempt/90)"

            if [ "$DEPLOYED_SHA" = "$TARGET_SHA" ]; then
              echo "Public production confirms target SHA: $TARGET_SHA"
              SITEMAP="$(curl -fsS https://build-autonomia.com/sitemap.xml)"
              FEED="$(curl -fsS https://build-autonomia.com/feed.xml)"
              printf '%s' "$SITEMAP" | grep -Fq "/territoires/guides/"
              printf '%s' "$FEED" | grep -Fq "/territoires/guides/"
              curl -fsS https://build-autonomia.com/territoires >/dev/null

              LP_URL="https://build-autonomia.com/observatoire-ia/ressources-humaines"
              LP_HTML="$(curl -fsS "$LP_URL")"
              CSS_PATH="$(printf '%s' "$LP_HTML" | python -c 'import re,sys; html=sys.stdin.read(); m=re.search(r"""href=["\x27]([^"\x27]+\.css(?:\?[^"\x27]*)?)["\x27]""", html); print(m.group(1) if m else "")')"
              if [ -z "$CSS_PATH" ]; then
                echo "::error::RH landing HTML does not reference a CSS asset."
                exit 1
              fi
              case "$CSS_PATH" in
                http://*|https://*) CSS_URL="$CSS_PATH" ;;
                *) CSS_URL="https://build-autonomia.com$CSS_PATH" ;;
              esac

              CSS_HEADERS="$(mktemp)"
              CSS_BODY="$(mktemp)"
              curl -fsS -D "$CSS_HEADERS" "$CSS_URL" -o "$CSS_BODY"
              CONTENT_TYPE="$(grep -i '^content-type:' "$CSS_HEADERS" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)"
              case "$CONTENT_TYPE" in
                text/css*) ;;
                *)
                  echo "::error::Expected text/css for $CSS_URL, got: $CONTENT_TYPE"
                  exit 1
                  ;;
              esac
              if ! grep -Fq ".miniModuleLab" "$CSS_BODY"; then
                echo "::error::Live CSS is not the LP stylesheet expected for interactive modules."
                exit 1
              fi
              echo "Verified RH landing stylesheet: $CSS_URL ($CONTENT_TYPE)"

              echo "Sitemap + RSS + Territoires + RH LP CSS smoke checks passed."
              exit 0
            fi

            echo "Public site not switched yet (attempt $attempt/90)."
            sleep 10
          done

          echo "::error::Public site did not switch to target SHA."
          exit 1

      - name: Dump public o2switch worker log on failure
        if: failure() && steps.target.outputs.should_deploy == 'true'
        run: |
          echo "===== PUBLIC HEALTH ====="
          curl -fsS "https://build-autonomia.com/api/health" || true
          echo
          echo "===== PUBLIC O2SWITCH WORKER LOG ====="
          curl -fsS "https://build-autonomia.com/__autonomia_deploy_debug.txt" || echo "Diagnostic log not reachable yet."
          echo
          echo "===== END PUBLIC O2SWITCH WORKER LOG ====="

      - name: Refresh GitHub OIDC identity for SEO diagnostic
        if: steps.target.outputs.should_deploy == 'true'
        id: seo_oidc
        env:
          AUDIENCE: autonomia-public-o2switch
        run: |
          RESPONSE="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify Search Console connection
        if: steps.target.outputs.should_deploy == 'true'
        env:
          STATUS_URL: https://build-autonomia.com/api/internal/search-console-status
          OIDC_TOKEN: ${{ steps.seo_oidc.outputs.token }}
        run: |
          STATUS="$(curl -fsS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$STATUS_URL")"
          printf '%s\n' "$STATUS"

          OK="$(printf '%s' "$STATUS" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("ok"))).lower())')"
          if [ "$OK" != "true" ]; then
            echo "::error::Search Console server connection is not healthy."
            exit 1
          fi
