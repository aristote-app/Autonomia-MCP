name: diagnose-o2switch-self-deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read o2switch self-deploy log
        env:
          TOKEN_A: ${{ secrets.AUTONOMIA_SELF_DEPLOY_TOKEN }}
          TOKEN_B: ${{ secrets.AUTONOMIA_INTERNAL_TOKEN }}
          LOG_URL: https://cockpit.build-autonomia.com/api/internal/self-deploy
        run: |
          echo "Trying configured internal-token secret names without exposing values..."
          SUCCESS=0
          for VAR in TOKEN_A TOKEN_B; do
            TOKEN="${!VAR}"
            if [ -z "$TOKEN" ]; then
              echo "$VAR is not configured in GitHub Actions."
              continue
            fi

            HTTP_CODE="$(curl -sS -o /tmp/self-deploy-log.json -w "%{http_code}" "$LOG_URL" -H "x-autonomia-token: $TOKEN")"
            echo "$VAR -> HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              python - <<'PY'
import json
p='/tmp/self-deploy-log.json'
data=json.load(open(p))
print('oidc_enabled:', data.get('oidc_enabled'))
print('legacy_enabled:', data.get('legacy_enabled'))
print('--- self-deploy.log tail ---')
print(data.get('log_tail',''))
PY
              SUCCESS=1
              break
            else
              cat /tmp/self-deploy-log.json || true
              echo
            fi
          done

          if [ "$SUCCESS" != "1" ]; then
            echo "No GitHub secret matched AUTONOMIA_INTERNAL_TOKEN on production."
            echo "Unauthenticated endpoint response:"
            curl -sS -i "$LOG_URL" | head -80 || true
          fi